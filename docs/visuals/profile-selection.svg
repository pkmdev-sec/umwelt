<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" fill="none" role="img">
  <title>Umwelt Profile Selection — Decision Tree</title>

  <defs>
    <!-- Gradients -->
    <linearGradient id="ps_green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ps_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="ps_pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/><stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="ps_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/><stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="ps_shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E11D48"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="850" fill="#000000" rx="12"/>

  <!-- Title -->
  <text x="700" y="38" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="20" font-weight="bold">Profile Selection — Decision Tree</text>
  <text x="700" y="58" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="12" opacity="0.5">Model tier → Token budget → Task type → Selected profile</text>

  <!-- ═══════════════════ LEVEL 1: MODEL DETECTION ═══════════════════ -->
  <rect x="580" y="80" width="240" height="50" rx="10" fill="#052E16" stroke="#10B981" stroke-width="2.5" filter="url(#ps_shadow)"/>
  <text x="700" y="111" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="15" font-weight="bold">MODEL DETECTED?</text>

  <!-- Branches from model detection -->
  <line x1="620" y1="130" x2="250" y2="175" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="700" y1="130" x2="700" y2="175" stroke="#0891B2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="780" y1="130" x2="1150" y2="175" stroke="#E11D48" stroke-width="2" marker-end="url(#arrowPink)"/>

  <!-- ═══════════════════ LEVEL 2: MODEL TIER ═══════════════════ -->
  <!-- Opus -->
  <rect x="150" y="180" width="200" height="46" rx="8" fill="#052E16" stroke="#059669" stroke-width="2" filter="url(#ps_shadow)"/>
  <text x="250" y="209" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="14" font-weight="bold">OPUS</text>

  <!-- Sonnet -->
  <rect x="600" y="180" width="200" height="46" rx="8" fill="#083344" stroke="#0891B2" stroke-width="2" filter="url(#ps_shadow)"/>
  <text x="700" y="209" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="14" font-weight="bold">SONNET</text>

  <!-- Haiku -->
  <rect x="1050" y="180" width="200" height="46" rx="8" fill="#4C0519" stroke="#E11D48" stroke-width="2" filter="url(#ps_shadow)"/>
  <text x="1150" y="209" text-anchor="middle" fill="#FB7185" font-family="monospace" font-size="14" font-weight="bold">HAIKU</text>

  <!-- ═══════════════════ LEVEL 3: TOKEN BUDGET CHECK ═══════════════════ -->
  <!-- Opus budget check -->
  <line x1="250" y1="226" x2="250" y2="275" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="145" y="280" width="210" height="46" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="309" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12">Token budget &gt; 50%?</text>

  <!-- Opus YES -->
  <line x1="195" y1="326" x2="140" y2="375" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="140" y="355" fill="#10B981" font-family="monospace" font-size="10" font-weight="bold">YES</text>

  <!-- Opus NO -->
  <line x1="305" y1="326" x2="350" y2="375" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="345" y="355" fill="#D97706" font-family="monospace" font-size="10" font-weight="bold">NO</text>

  <!-- Sonnet budget check -->
  <line x1="700" y1="226" x2="700" y2="275" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <rect x="595" y="280" width="210" height="46" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <text x="700" y="309" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12">Token budget &gt; 75%?</text>

  <!-- Sonnet YES -->
  <line x1="645" y1="326" x2="570" y2="375" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="580" y="355" fill="#06B6D4" font-family="monospace" font-size="10" font-weight="bold">YES</text>

  <!-- Sonnet NO -->
  <line x1="755" y1="326" x2="850" y2="375" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="820" y="355" fill="#D97706" font-family="monospace" font-size="10" font-weight="bold">NO</text>

  <!-- Haiku → always minimal -->
  <line x1="1150" y1="226" x2="1150" y2="375" stroke="#E11D48" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <text x="1170" y="310" fill="#FB7185" font-family="monospace" font-size="10">always</text>

  <!-- ═══════════════════ LEVEL 4: TASK TYPE ═══════════════════ -->
  <!-- Opus YES → task type -->
  <rect x="60" y="380" width="180" height="46" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <text x="150" y="409" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12">Task type?</text>

  <!-- Opus task branches -->
  <line x1="105" y1="426" x2="80" y2="515" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="60" y="475" fill="#64748B" font-family="monospace" font-size="9">debug task</text>
  <line x1="195" y1="426" x2="270" y2="515" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="250" y="475" fill="#64748B" font-family="monospace" font-size="9">dev task</text>

  <!-- Opus NO → downgrade box -->
  <rect x="305" y="380" width="170" height="46" rx="8" fill="#1C1917" stroke="#D97706" stroke-width="2" filter="url(#ps_shadow)"/>
  <text x="390" y="401" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="12" font-weight="bold">DOWNGRADE</text>
  <text x="390" y="418" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="10">→ dev (balanced)</text>
  <line x1="390" y1="426" x2="290" y2="515" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowAmber)"/>

  <!-- Sonnet YES → task type -->
  <rect x="500" y="380" width="180" height="46" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <text x="590" y="409" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12">Task type?</text>

  <!-- Sonnet task branches -->
  <line x1="545" y1="426" x2="480" y2="515" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="480" y="475" fill="#64748B" font-family="monospace" font-size="9">dev task</text>
  <line x1="635" y1="426" x2="660" y2="515" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="660" y="475" fill="#64748B" font-family="monospace" font-size="9">review task</text>

  <!-- Sonnet NO → downgrade box -->
  <rect x="780" y="380" width="170" height="46" rx="8" fill="#1C1917" stroke="#D97706" stroke-width="2" filter="url(#ps_shadow)"/>
  <text x="865" y="401" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="12" font-weight="bold">DOWNGRADE</text>
  <text x="865" y="418" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="10">→ minimal (&lt;200)</text>
  <line x1="865" y1="426" x2="860" y2="515" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowAmber)"/>

  <!-- ═══════════════════ LEVEL 5: FINAL PROFILES (Bottom Row) ═══════════════════ -->

  <!-- Box 1: debug (Opus) — x=30 -->
  <rect x="30" y="520" width="160" height="70" rx="8" fill="#052E16" stroke="#059669" stroke-width="2.5" filter="url(#ps_shadow)"/>
  <text x="110" y="552" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="15" font-weight="bold">debug</text>
  <text x="110" y="572" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10">full context</text>

  <!-- Box 2: dev / Opus — x=220 -->
  <rect x="220" y="520" width="160" height="70" rx="8" fill="#052E16" stroke="#059669" stroke-width="2" filter="url(#ps_shadow)"/>
  <text x="300" y="552" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="15" font-weight="bold">dev</text>
  <text x="300" y="572" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10">balanced (opus)</text>

  <!-- Box 3: dev / Sonnet — x=410 -->
  <rect x="410" y="520" width="160" height="70" rx="8" fill="#083344" stroke="#0891B2" stroke-width="2.5" filter="url(#ps_shadow)"/>
  <text x="490" y="552" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="15" font-weight="bold">dev</text>
  <text x="490" y="572" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="10">balanced (sonnet)</text>

  <!-- Box 4: review — x=600 -->
  <rect x="600" y="520" width="160" height="70" rx="8" fill="#083344" stroke="#0891B2" stroke-width="2" filter="url(#ps_shadow)"/>
  <text x="680" y="552" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="15" font-weight="bold">review</text>
  <text x="680" y="572" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="10">diff focused</text>

  <!-- Box 5: minimal / budget — x=790 -->
  <rect x="790" y="520" width="170" height="70" rx="8" fill="#1C1917" stroke="#D97706" stroke-width="2" filter="url(#ps_shadow)"/>
  <text x="875" y="552" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="15" font-weight="bold">minimal</text>
  <text x="875" y="572" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="10">&lt;200 tokens (budget)</text>

  <!-- Box 6: minimal / Haiku — x=1000 -->
  <rect x="1000" y="520" width="170" height="70" rx="8" fill="#4C0519" stroke="#E11D48" stroke-width="2.5" filter="url(#ps_shadow)"/>
  <text x="1085" y="552" text-anchor="middle" fill="#FB7185" font-family="monospace" font-size="15" font-weight="bold">minimal</text>
  <text x="1085" y="572" text-anchor="middle" fill="#FDA4AF" font-family="monospace" font-size="10">&lt;200 tokens (haiku)</text>

  <!-- Haiku arrow to its final box -->
  <line x1="1150" y1="380" x2="1085" y2="515" stroke="#E11D48" stroke-width="1.5" marker-end="url(#arrowPink)"/>

  <!-- ═══════════════════ PROFILE DETAIL CARDS ═══════════════════ -->
  <rect x="30" y="625" width="1140" height="120" rx="10" fill="#0A0A0A" stroke="#1E293B" stroke-width="1"/>

  <!-- debug detail -->
  <rect x="55" y="645" width="160" height="80" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1" opacity="0.7"/>
  <text x="135" y="665" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">debug profile</text>
  <text x="135" y="682" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="8">max_tokens: 16000</text>
  <text x="135" y="695" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="8">loaders: ALL</text>
  <text x="135" y="708" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="8">verbose: true</text>

  <!-- dev detail -->
  <rect x="240" y="645" width="160" height="80" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1" opacity="0.7"/>
  <text x="320" y="665" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">dev profile</text>
  <text x="320" y="682" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="8">max_tokens: 8000</text>
  <text x="320" y="695" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="8">loaders: git,deps,env</text>
  <text x="320" y="708" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="8">verbose: false</text>

  <!-- review detail -->
  <rect x="425" y="645" width="160" height="80" rx="6" fill="#0F172A" stroke="#0891B2" stroke-width="1" opacity="0.7"/>
  <text x="505" y="665" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="10" font-weight="bold">review profile</text>
  <text x="505" y="682" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="8">max_tokens: 4000</text>
  <text x="505" y="695" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="8">loaders: git-diff</text>
  <text x="505" y="708" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="8">focus: changes only</text>

  <!-- minimal detail -->
  <rect x="610" y="645" width="160" height="80" rx="6" fill="#0F172A" stroke="#D97706" stroke-width="1" opacity="0.7"/>
  <text x="690" y="665" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="10" font-weight="bold">minimal profile</text>
  <text x="690" y="682" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="8">max_tokens: 200</text>
  <text x="690" y="695" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="8">loaders: none</text>
  <text x="690" y="708" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="8">budget-safe mode</text>

  <!-- haiku minimal detail -->
  <rect x="795" y="645" width="160" height="80" rx="6" fill="#0F172A" stroke="#E11D48" stroke-width="1" opacity="0.7"/>
  <text x="875" y="665" text-anchor="middle" fill="#FB7185" font-family="monospace" font-size="10" font-weight="bold">minimal (haiku)</text>
  <text x="875" y="682" text-anchor="middle" fill="#FDA4AF" font-family="monospace" font-size="8">max_tokens: 200</text>
  <text x="875" y="695" text-anchor="middle" fill="#FDA4AF" font-family="monospace" font-size="8">loaders: none</text>
  <text x="875" y="708" text-anchor="middle" fill="#FDA4AF" font-family="monospace" font-size="8">always this tier</text>

  <!-- ═══════════════════ LEGEND ═══════════════════ -->
  <rect x="30" y="775" width="1140" height="50" rx="8" fill="#0A0A0A" stroke="#1E293B" stroke-width="1"/>

  <circle cx="70" cy="800" r="7" fill="#059669"/>
  <text x="85" y="804" fill="#6EE7B7" font-family="monospace" font-size="11">Opus path</text>

  <circle cx="230" cy="800" r="7" fill="#0891B2"/>
  <text x="245" y="804" fill="#67E8F9" font-family="monospace" font-size="11">Sonnet path</text>

  <circle cx="410" cy="800" r="7" fill="#E11D48"/>
  <text x="425" y="804" fill="#FDA4AF" font-family="monospace" font-size="11">Haiku path</text>

  <circle cx="580" cy="800" r="7" fill="#D97706"/>
  <text x="595" y="804" fill="#FBBF24" font-family="monospace" font-size="11">Budget exceeded → downgrade</text>

  <rect x="870" y="790" width="20" height="3" rx="1" fill="#475569"/>
  <text x="898" y="797" fill="#94A3B8" font-family="monospace" font-size="9">decision node</text>

  <rect x="870" y="803" width="20" height="3" rx="1" fill="#D97706" stroke-dasharray="4 2"/>
  <text x="898" y="810" fill="#94A3B8" font-family="monospace" font-size="9">downgrade path (dashed)</text>
</svg>