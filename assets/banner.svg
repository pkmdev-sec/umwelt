<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- Logo teal gradient -->
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <!-- Logo glow -->
    <radialGradient id="logoGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>
    </radialGradient>
    <!-- Circle container gradient -->
    <radialGradient id="circleGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="85%" stop-color="#0a0a0a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Title glow filter -->
    <filter id="titleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- Border frame -->
  <rect x="8" y="8" width="1484" height="484" rx="12" ry="12" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Subtle inner border accent -->
  <rect x="12" y="12" width="1476" height="476" rx="10" ry="10" fill="none" stroke="#1a1a2e" stroke-width="0.5" opacity="0.5"/>

  <!-- === LEFT SIDE: Logo === -->

  <!-- Logo glow background -->
  <circle cx="300" cy="250" r="200" fill="url(#logoGlow)"/>

  <!-- Circular container -->
  <circle cx="300" cy="250" r="180" fill="url(#circleGrad)"/>
  <circle cx="300" cy="250" r="180" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.25"/>

  <!-- Outer ring (system) - perception layer 3 -->
  <ellipse cx="300" cy="250" rx="140" ry="100" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.3"/>

  <!-- Middle ring (project) - perception layer 2 -->
  <ellipse cx="300" cy="250" rx="105" ry="75" fill="none" stroke="#00d4aa" stroke-width="1.8" opacity="0.5"/>

  <!-- Inner ring (immediate) - perception layer 1 -->
  <ellipse cx="300" cy="250" rx="70" ry="50" fill="none" stroke="#00d4aa" stroke-width="2" opacity="0.8"/>

  <!-- Central eye shape - geometric lens -->
  <path d="M 220 250 Q 260 200 300 195 Q 340 200 380 250 Q 340 300 300 305 Q 260 300 220 250 Z" fill="url(#tealGrad)" opacity="0.9"/>

  <!-- Eye inner detail - pupil -->
  <circle cx="300" cy="250" r="22" fill="#0d1117" opacity="0.85"/>
  <circle cx="300" cy="250" r="14" fill="url(#tealGrad)" opacity="0.7"/>
  <circle cx="300" cy="250" r="6" fill="#0d1117"/>

  <!-- Eye highlight -->
  <circle cx="290" cy="242" r="4" fill="#ffffff" opacity="0.5"/>

  <!-- Concentric arc decorations (top halves) -->
  <path d="M 175 250 A 125 90 0 0 1 425 250" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.15"/>
  <path d="M 160 250 A 140 100 0 0 1 440 250" fill="none" stroke="#00d4aa" stroke-width="0.8" opacity="0.1"/>

  <!-- Concentric arc decorations (bottom halves) -->
  <path d="M 175 250 A 125 90 0 0 0 425 250" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.15"/>
  <path d="M 160 250 A 140 100 0 0 0 440 250" fill="none" stroke="#00d4aa" stroke-width="0.8" opacity="0.1"/>

  <!-- === RIGHT SIDE: Text === -->

  <!-- Title -->
  <text x="620" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" fill="#00d4aa" filter="url(#titleGlow)">UMWELT</text>

  <!-- Subtitle -->
  <text x="625" y="280" font-family="'SF Mono', 'Fira Code', monospace" font-size="28" fill="#8b949e" letter-spacing="8" text-transform="uppercase">ENVIRONMENT INTELLIGENCE</text>

  <!-- Tagline -->
  <text x="625" y="320" font-family="'SF Mono', 'Fira Code', monospace" font-size="18" fill="#6e7681">diff-based injection / predictive loading / cache-optimized context</text>

  <!-- Version badge -->
  <rect x="625" y="355" width="62" height="28" rx="14" fill="transparent" stroke="#00d4aa" stroke-width="1.2" opacity="0.6"/>
  <text x="656" y="374" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#00d4aa" text-anchor="middle" opacity="0.8">v1.0</text>

  <!-- Subtle decorative line -->
  <line x1="620" y1="340" x2="1100" y2="340" stroke="#21262d" stroke-width="0.5"/>
</svg>
