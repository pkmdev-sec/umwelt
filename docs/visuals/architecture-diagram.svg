<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" fill="none" role="img">
  <title>Umwelt Architecture — Scanning Pipeline</title>

  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="boxShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#020617" rx="12"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="18" font-weight="bold">UMWELT — Scanning Architecture</text>
  <text x="500" y="58" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="11" opacity="0.6">Profiles → Loaders → Diff Engine → Cache Split → Output Assembly → Hook Injection</text>

  <!-- ===== STAGE 1: PROFILES ===== -->
  <rect x="30" y="85" width="130" height="200" rx="8" fill="#052E16" stroke="#059669" stroke-width="1.5" filter="url(#boxShadow)"/>
  <text x="95" y="108" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold">PROFILES</text>
  <line x1="45" y1="115" x2="145" y2="115" stroke="#059669" stroke-width="0.5" opacity="0.4"/>

  <rect x="42" y="125" width="106" height="24" rx="4" fill="#059669" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="95" y="141" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10">dev</text>

  <rect x="42" y="155" width="106" height="24" rx="4" fill="#059669" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="95" y="171" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10">debug</text>

  <rect x="42" y="185" width="106" height="24" rx="4" fill="#059669" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="95" y="201" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10">review</text>

  <rect x="42" y="215" width="106" height="24" rx="4" fill="#059669" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="95" y="231" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10">deploy</text>

  <rect x="42" y="245" width="106" height="24" rx="4" fill="#059669" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="95" y="261" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10">minimal</text>

  <!-- Arrow 1→2 -->
  <line x1="160" y1="185" x2="195" y2="185" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <defs><marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#34D399"/></marker></defs>

  <!-- ===== STAGE 2: LOADERS (PARALLEL) ===== -->
  <rect x="200" y="75" width="155" height="310" rx="8" fill="#022C22" stroke="#0D9488" stroke-width="1.5" filter="url(#boxShadow)"/>
  <text x="277" y="98" text-anchor="middle" fill="#2DD4BF" font-family="monospace" font-size="12" font-weight="bold">LOADERS</text>
  <text x="277" y="112" text-anchor="middle" fill="#5EEAD4" font-family="monospace" font-size="9" opacity="0.5">parallel execution</text>

  <rect x="212" y="122" width="131" height="22" rx="3" fill="#0D9488" fill-opacity="0.15" stroke="#14B8A6" stroke-width="1"/>
  <text x="277" y="137" text-anchor="middle" fill="#5EEAD4" font-family="monospace" font-size="9">git-context</text>

  <rect x="212" y="150" width="131" height="22" rx="3" fill="#0D9488" fill-opacity="0.15" stroke="#14B8A6" stroke-width="1"/>
  <text x="277" y="165" text-anchor="middle" fill="#5EEAD4" font-family="monospace" font-size="9">test-status</text>

  <rect x="212" y="178" width="131" height="22" rx="3" fill="#0D9488" fill-opacity="0.15" stroke="#14B8A6" stroke-width="1"/>
  <text x="277" y="193" text-anchor="middle" fill="#5EEAD4" font-family="monospace" font-size="9">env-summary</text>

  <rect x="212" y="206" width="131" height="22" rx="3" fill="#0D9488" fill-opacity="0.15" stroke="#14B8A6" stroke-width="1"/>
  <text x="277" y="221" text-anchor="middle" fill="#5EEAD4" font-family="monospace" font-size="9">docker-status</text>

  <rect x="212" y="234" width="131" height="22" rx="3" fill="#0D9488" fill-opacity="0.15" stroke="#14B8A6" stroke-width="1"/>
  <text x="277" y="249" text-anchor="middle" fill="#5EEAD4" font-family="monospace" font-size="9">deps-audit</text>

  <rect x="212" y="262" width="131" height="22" rx="3" fill="#0D9488" fill-opacity="0.15" stroke="#14B8A6" stroke-width="1"/>
  <text x="277" y="277" text-anchor="middle" fill="#5EEAD4" font-family="monospace" font-size="9">project-summary</text>

  <rect x="212" y="290" width="131" height="22" rx="3" fill="#0D9488" fill-opacity="0.15" stroke="#14B8A6" stroke-width="1"/>
  <text x="277" y="305" text-anchor="middle" fill="#5EEAD4" font-family="monospace" font-size="9">api-health</text>

  <!-- Parallel indicator bars -->
  <rect x="210" y="322" width="135" height="16" rx="3" fill="#14B8A6" fill-opacity="0.1"/>
  <text x="277" y="333" text-anchor="middle" fill="#5EEAD4" font-family="monospace" font-size="8" opacity="0.5">▸▸▸ parallel ▸▸▸</text>

  <!-- Arrow 2→3 -->
  <line x1="355" y1="230" x2="390" y2="230" stroke="#2DD4BF" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <defs><marker id="arrowTeal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2DD4BF"/></marker></defs>

  <!-- ===== STAGE 3: DIFF ENGINE ===== -->
  <rect x="395" y="130" width="130" height="200" rx="8" fill="#083344" stroke="#0891B2" stroke-width="1.5" filter="url(#boxShadow)"/>
  <text x="460" y="155" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="12" font-weight="bold">DIFF ENGINE</text>
  <line x1="410" y1="162" x2="510" y2="162" stroke="#0891B2" stroke-width="0.5" opacity="0.4"/>

  <text x="460" y="182" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="9">hash previous</text>
  <text x="460" y="200" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="9">compare current</text>
  <text x="460" y="218" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="9">skip unchanged</text>
  <text x="460" y="236" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="9">mark [changed]</text>

  <rect x="415" y="250" width="90" height="28" rx="4" fill="#0891B2" fill-opacity="0.2" stroke="#22D3EE" stroke-width="1"/>
  <text x="460" y="268" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="10" font-weight="bold">80-90%</text>
  <text x="460" y="295" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="9" opacity="0.5">token savings</text>

  <!-- Arrow 3→4 -->
  <line x1="525" y1="230" x2="560" y2="230" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
  <defs><marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#22D3EE"/></marker></defs>

  <!-- ===== STAGE 4: CACHE SPLIT ===== -->
  <rect x="565" y="130" width="130" height="200" rx="8" fill="#1C1917" stroke="#D97706" stroke-width="1.5" filter="url(#boxShadow)"/>
  <text x="630" y="155" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="12" font-weight="bold">CACHE SPLIT</text>
  <line x1="580" y1="162" x2="680" y2="162" stroke="#D97706" stroke-width="0.5" opacity="0.4"/>

  <rect x="577" y="172" width="106" height="42" rx="4" fill="#D97706" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1"/>
  <text x="630" y="189" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="10" font-weight="bold">STABLE</text>
  <text x="630" y="204" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="8">OS, shell, runtimes</text>

  <rect x="577" y="222" width="106" height="42" rx="4" fill="#D97706" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1"/>
  <text x="630" y="239" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="10" font-weight="bold">VOLATILE</text>
  <text x="630" y="254" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="8">git, ports, load</text>

  <text x="630" y="290" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="9" opacity="0.5">90% cache hits</text>

  <!-- Arrow 4→5 -->
  <line x1="695" y1="230" x2="730" y2="230" stroke="#FCD34D" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <defs><marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#FCD34D"/></marker></defs>

  <!-- ===== STAGE 5: OUTPUT ASSEMBLY ===== -->
  <rect x="735" y="130" width="120" height="200" rx="8" fill="#2E1065" stroke="#7C3AED" stroke-width="1.5" filter="url(#boxShadow)"/>
  <text x="795" y="155" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="12" font-weight="bold">ASSEMBLY</text>
  <line x1="750" y1="162" x2="840" y2="162" stroke="#7C3AED" stroke-width="0.5" opacity="0.4"/>

  <text x="795" y="182" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="9">1. sigil template</text>
  <text x="795" y="200" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="9">2. stable env</text>
  <text x="795" y="218" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="9">3. volatile env</text>
  <text x="795" y="236" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="9">4. task loaders</text>
  <text x="795" y="254" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="9">5. cost metadata</text>

  <text x="795" y="285" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="9" opacity="0.5">priority trimmed</text>

  <!-- Arrow 5→6 -->
  <line x1="855" y1="230" x2="885" y2="230" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arrowViolet)"/>
  <defs><marker id="arrowViolet" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#A78BFA"/></marker></defs>

  <!-- ===== STAGE 6: HOOK INJECTION ===== -->
  <rect x="890" y="155" width="90" height="150" rx="8" fill="#4C0519" stroke="#E11D48" stroke-width="1.5" filter="url(#boxShadow)"/>
  <text x="935" y="180" text-anchor="middle" fill="#FB7185" font-family="monospace" font-size="11" font-weight="bold">HOOK</text>
  <text x="935" y="195" text-anchor="middle" fill="#FDA4AF" font-family="monospace" font-size="9">INJECT</text>
  <line x1="900" y1="202" x2="970" y2="202" stroke="#E11D48" stroke-width="0.5" opacity="0.4"/>

  <text x="935" y="222" text-anchor="middle" fill="#FDA4AF" font-family="monospace" font-size="8">Session</text>
  <text x="935" y="236" text-anchor="middle" fill="#FDA4AF" font-family="monospace" font-size="8">Prompt</text>
  <text x="935" y="250" text-anchor="middle" fill="#FDA4AF" font-family="monospace" font-size="8">Subagent</text>
  <text x="935" y="264" text-anchor="middle" fill="#FDA4AF" font-family="monospace" font-size="8">PreCompact</text>

  <!-- ===== BOTTOM: TOKEN BUDGET BAR ===== -->
  <rect x="30" y="420" width="940" height="50" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="70" y="440" fill="#94A3B8" font-family="monospace" font-size="10">TOKEN BUDGET</text>
  <rect x="180" y="430" width="600" height="20" rx="4" fill="#1E293B"/>
  <rect x="180" y="430" width="300" height="20" rx="4" fill="url(#emeraldGrad)" opacity="0.6"/>
  <text x="330" y="444" text-anchor="middle" fill="#ECFDF5" font-family="monospace" font-size="9" font-weight="bold">50% — dev profile</text>
  <line x1="480" y1="425" x2="480" y2="455" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  <text x="480" y="468" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="8">75% → minimal</text>
  <line x1="660" y1="425" x2="660" y2="455" stroke="#E11D48" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  <text x="660" y="468" text-anchor="middle" fill="#FB7185" font-family="monospace" font-size="8">90% → silent</text>

  <!-- ===== BOTTOM: COST TRACKER ===== -->
  <rect x="30" y="500" width="940" height="50" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="70" y="520" fill="#94A3B8" font-family="monospace" font-size="10">SESSION COST</text>
  <rect x="180" y="510" width="600" height="20" rx="4" fill="#1E293B"/>
  <rect x="180" y="510" width="120" height="20" rx="4" fill="url(#tealGrad)" opacity="0.6"/>
  <text x="240" y="524" text-anchor="middle" fill="#ECFDF5" font-family="monospace" font-size="9" font-weight="bold">$0.03 — full</text>
  <line x1="300" y1="505" x2="300" y2="535" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  <text x="300" y="548" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="8">$0.10 → reduced</text>
  <line x1="480" y1="505" x2="480" y2="535" stroke="#FB7185" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  <text x="480" y="548" text-anchor="middle" fill="#FB7185" font-family="monospace" font-size="8">$0.25 → minimal</text>
  <line x1="660" y1="505" x2="660" y2="535" stroke="#E11D48" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  <text x="660" y="548" text-anchor="middle" fill="#E11D48" font-family="monospace" font-size="8">$0.50 → silent</text>

  <!-- Stage labels along the bottom -->
  <text x="95" y="405" text-anchor="middle" fill="#059669" font-family="monospace" font-size="8" opacity="0.4">SELECT</text>
  <text x="277" y="405" text-anchor="middle" fill="#0D9488" font-family="monospace" font-size="8" opacity="0.4">SCAN</text>
  <text x="460" y="405" text-anchor="middle" fill="#0891B2" font-family="monospace" font-size="8" opacity="0.4">DIFF</text>
  <text x="630" y="405" text-anchor="middle" fill="#D97706" font-family="monospace" font-size="8" opacity="0.4">SPLIT</text>
  <text x="795" y="405" text-anchor="middle" fill="#7C3AED" font-family="monospace" font-size="8" opacity="0.4">ASSEMBLE</text>
  <text x="935" y="405" text-anchor="middle" fill="#E11D48" font-family="monospace" font-size="8" opacity="0.4">INJECT</text>
</svg>
