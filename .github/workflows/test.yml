name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      - name: Run tests
        run: |
          chmod +x umwelt
          chmod +x lib/*.sh loaders/*.sh profiles/*.sh tests/*.sh
          ./umwelt test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck -x umwelt
          shellcheck -x lib/*.sh
          shellcheck -x loaders/*.sh
          shellcheck -x profiles/*.sh
