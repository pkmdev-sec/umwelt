<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img">
  <title>Umwelt — Environment Intelligence</title>
  <desc>A geometric eye/lens at center with concentric perception rings representing layers of environment awareness: immediate (git, cwd), project (docker, tests), system (OS, APIs).</desc>

  <defs>
    <!-- Primary gradient: electric teal → deep indigo -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Iris gradient: teal center fading to indigo -->
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="40%" stop-color="#00b896"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </radialGradient>

    <!-- Pupil gradient: deep indigo core -->
    <radialGradient id="pupilGrad" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>

    <!-- Highlight: warm amber for the eye glint -->
    <radialGradient id="glintGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring gradients with varying opacity for depth -->
    <linearGradient id="ring1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00d4aa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ring2Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#4338ca" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="ring3Grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00d4aa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>

    <!-- Clip for eye shape -->
    <clipPath id="eyeClip">
      <path d="M 256 176 Q 160 256 256 336 Q 352 256 256 176 Z"/>
    </clipPath>
  </defs>

  <!-- ==================== OUTER RING (System: OS, APIs, processes) ==================== -->
  <!-- Full circle, thin stroke, subtle -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#ring3Grad)" stroke-width="1.5"/>
  <!-- Partial arcs for visual interest -->
  <path d="M 256 26 A 230 230 0 0 1 486 256" fill="none" stroke="#4338ca" stroke-width="1" opacity="0.15"/>
  <path d="M 486 256 A 230 230 0 0 1 256 486" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.12"/>
  <path d="M 256 486 A 230 230 0 0 1 26 256" fill="none" stroke="#4338ca" stroke-width="1" opacity="0.15"/>
  <path d="M 26 256 A 230 230 0 0 1 256 26" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.12"/>

  <!-- Outer ring tick marks (8 compass points) -->
  <line x1="256" y1="26" x2="256" y2="38" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="256" y1="474" x2="256" y2="486" stroke="#00d4aa" stroke-width="1" opacity="0.3"/>
  <line x1="26" y1="256" x2="38" y2="256" stroke="#4338ca" stroke-width="1" opacity="0.3"/>
  <line x1="474" y1="256" x2="486" y2="256" stroke="#4338ca" stroke-width="1" opacity="0.3"/>
  <line x1="93" y1="93" x2="101" y2="101" stroke="#00d4aa" stroke-width="1" opacity="0.2"/>
  <line x1="411" y1="93" x2="419" y2="101" stroke="#4338ca" stroke-width="1" opacity="0.2"/>
  <line x1="411" y1="411" x2="419" y2="419" stroke="#00d4aa" stroke-width="1" opacity="0.2"/>
  <line x1="93" y1="411" x2="101" y2="419" stroke="#4338ca" stroke-width="1" opacity="0.2"/>

  <!-- Small data nodes on outer ring -->
  <circle cx="256" cy="26" r="3" fill="#00d4aa" opacity="0.35"/>
  <circle cx="486" cy="256" r="3" fill="#4338ca" opacity="0.35"/>
  <circle cx="256" cy="486" r="3" fill="#00d4aa" opacity="0.35"/>
  <circle cx="26" cy="256" r="3" fill="#4338ca" opacity="0.35"/>

  <!-- ==================== MIDDLE RING (Project: docker, tests) ==================== -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#ring2Grad)" stroke-width="1.5" stroke-dasharray="16 8"/>
  <!-- Accent arcs -->
  <path d="M 256 86 A 170 170 0 0 1 426 256" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.25"/>
  <path d="M 426 256 A 170 170 0 0 1 256 426" fill="none" stroke="#4338ca" stroke-width="1" opacity="0.2"/>
  <path d="M 256 426 A 170 170 0 0 1 86 256" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.25"/>
  <path d="M 86 256 A 170 170 0 0 1 256 86" fill="none" stroke="#4338ca" stroke-width="1" opacity="0.2"/>

  <!-- Mid-ring nodes -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="86" r="4" fill="#00d4aa" opacity="0.5"/>
    <circle cx="426" cy="256" r="4" fill="#4338ca" opacity="0.5"/>
    <circle cx="256" cy="426" r="4" fill="#00d4aa" opacity="0.5"/>
    <circle cx="86" cy="256" r="4" fill="#4338ca" opacity="0.5"/>
  </g>

  <!-- Diagonal mid-ring nodes -->
  <circle cx="376" cy="136" r="2.5" fill="#00d4aa" opacity="0.35"/>
  <circle cx="376" cy="376" r="2.5" fill="#4338ca" opacity="0.35"/>
  <circle cx="136" cy="376" r="2.5" fill="#00d4aa" opacity="0.35"/>
  <circle cx="136" cy="136" r="2.5" fill="#4338ca" opacity="0.35"/>

  <!-- ==================== INNER RING (Immediate: git, cwd) ==================== -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="256" r="110" fill="none" stroke="url(#ring1Grad)" stroke-width="2"/>
  </g>

  <!-- Inner ring small accent arcs -->
  <path d="M 256 146 A 110 110 0 0 1 366 256" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.5"/>
  <path d="M 366 256 A 110 110 0 0 1 256 366" fill="none" stroke="#4338ca" stroke-width="1.5" opacity="0.45"/>
  <path d="M 256 366 A 110 110 0 0 1 146 256" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.5"/>
  <path d="M 146 256 A 110 110 0 0 1 256 146" fill="none" stroke="#4338ca" stroke-width="1.5" opacity="0.45"/>

  <!-- Inner ring nodes -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="146" r="5" fill="#00d4aa" opacity="0.7"/>
    <circle cx="256" cy="146" r="2.5" fill="#fff" opacity="0.5"/>
    <circle cx="366" cy="256" r="5" fill="#4338ca" opacity="0.7"/>
    <circle cx="366" cy="256" r="2.5" fill="#fff" opacity="0.4"/>
    <circle cx="256" cy="366" r="5" fill="#00d4aa" opacity="0.7"/>
    <circle cx="256" cy="366" r="2.5" fill="#fff" opacity="0.5"/>
    <circle cx="146" cy="256" r="5" fill="#4338ca" opacity="0.7"/>
    <circle cx="146" cy="256" r="2.5" fill="#fff" opacity="0.4"/>
  </g>

  <!-- ==================== SENSING LINES (connecting rings to eye) ==================== -->
  <!-- Lines from inner ring to eye area -->
  <line x1="256" y1="146" x2="256" y2="180" stroke="#00d4aa" stroke-width="1" opacity="0.4"/>
  <line x1="256" y1="366" x2="256" y2="332" stroke="#00d4aa" stroke-width="1" opacity="0.4"/>
  <line x1="146" y1="256" x2="172" y2="256" stroke="#4338ca" stroke-width="1" opacity="0.4"/>
  <line x1="366" y1="256" x2="340" y2="256" stroke="#4338ca" stroke-width="1" opacity="0.4"/>

  <!-- Diagonal sensing lines -->
  <line x1="178" y1="178" x2="205" y2="205" stroke="#00d4aa" stroke-width="0.8" opacity="0.25"/>
  <line x1="334" y1="178" x2="307" y2="205" stroke="#4338ca" stroke-width="0.8" opacity="0.25"/>
  <line x1="334" y1="334" x2="307" y2="307" stroke="#00d4aa" stroke-width="0.8" opacity="0.25"/>
  <line x1="178" y1="334" x2="205" y2="307" stroke="#4338ca" stroke-width="0.8" opacity="0.25"/>

  <!-- ==================== THE EYE / LENS (Central Observer) ==================== -->
  <g filter="url(#subtleShadow)">
    <!-- Eye outer shape — almond/lens form -->
    <path d="M 256 176 Q 160 256 256 336 Q 352 256 256 176 Z"
      fill="url(#irisGrad)" stroke="url(#eyeGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Eye inner iris ring -->
  <g filter="url(#coreGlow)">
    <circle cx="256" cy="256" r="42" fill="url(#irisGrad)" stroke="#00d4aa" stroke-width="1.5" opacity="0.9"/>
  </g>

  <!-- Pupil -->
  <circle cx="256" cy="256" r="22" fill="url(#pupilGrad)"/>

  <!-- Inner pupil depth -->
  <circle cx="256" cy="256" r="12" fill="#0f0a2e"/>

  <!-- Eye glint — warm amber spark of intelligence -->
  <g filter="url(#softGlow)">
    <circle cx="246" cy="244" r="7" fill="url(#glintGrad)"/>
    <circle cx="246" cy="244" r="3.5" fill="#f59e0b" opacity="0.9"/>
  </g>
  <!-- Secondary smaller glint -->
  <circle cx="268" cy="264" r="3" fill="#f59e0b" opacity="0.3"/>

  <!-- Eye lid lines — upper and lower for definition -->
  <path d="M 256 176 Q 160 256 256 336" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.5"/>
  <path d="M 256 176 Q 352 256 256 336" fill="none" stroke="#4338ca" stroke-width="1" opacity="0.5"/>

  <!-- Upper crease line for depth -->
  <path d="M 200 188 Q 256 162 312 188" fill="none" stroke="#00d4aa" stroke-width="0.8" opacity="0.3"/>
  <!-- Lower crease -->
  <path d="M 200 324 Q 256 350 312 324" fill="none" stroke="#4338ca" stroke-width="0.8" opacity="0.3"/>

  <!-- Corner accents — teal triangles suggesting alertness -->
  <path d="M 160 256 L 172 250 L 172 262 Z" fill="#00d4aa" opacity="0.4"/>
  <path d="M 352 256 L 340 250 L 340 262 Z" fill="#4338ca" opacity="0.4"/>

  <!-- ==================== AMBIENT PARTICLES ==================== -->
  <!-- Tiny floating perception dots -->
  <circle cx="200" cy="120" r="1.5" fill="#00d4aa" opacity="0.25"/>
  <circle cx="312" cy="120" r="1.5" fill="#4338ca" opacity="0.25"/>
  <circle cx="400" cy="200" r="1.5" fill="#4338ca" opacity="0.2"/>
  <circle cx="400" cy="312" r="1.5" fill="#00d4aa" opacity="0.2"/>
  <circle cx="312" cy="400" r="1.5" fill="#00d4aa" opacity="0.25"/>
  <circle cx="200" cy="400" r="1.5" fill="#4338ca" opacity="0.25"/>
  <circle cx="112" cy="312" r="1.5" fill="#00d4aa" opacity="0.2"/>
  <circle cx="112" cy="200" r="1.5" fill="#4338ca" opacity="0.2"/>

  <!-- Amber awareness particles near the eye -->
  <circle cx="220" cy="230" r="1" fill="#f59e0b" opacity="0.3"/>
  <circle cx="292" cy="230" r="1" fill="#f59e0b" opacity="0.25"/>
  <circle cx="220" cy="282" r="1" fill="#f59e0b" opacity="0.25"/>
  <circle cx="292" cy="282" r="1" fill="#f59e0b" opacity="0.3"/>
</svg>