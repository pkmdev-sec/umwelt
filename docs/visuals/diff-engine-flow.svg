<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" fill="none" role="img">
  <title>Umwelt Diff Engine — Only Inject Changes</title>

  <defs>
    <linearGradient id="df_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="df_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="df_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/><stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="df_shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="df_arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#34D399"/>
    </marker>
    <marker id="df_arrowC" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22D3EE"/>
    </marker>
    <marker id="df_arrowA" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#FCD34D"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" fill="#020617" rx="10"/>

  <!-- Title -->
  <text x="350" y="32" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="16" font-weight="bold">Diff Engine — Only Inject Changes</text>
  <text x="350" y="50" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10" opacity="0.5">80-90% token savings on repeated scans</text>

  <!-- === ROW 1: FIRST CALL (Full scan) === -->
  <text x="30" y="85" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="bold">FIRST CALL</text>

  <!-- Scan box -->
  <rect x="30" y="95" width="120" height="55" rx="6" fill="#052E16" stroke="#059669" stroke-width="1.5" filter="url(#df_shadow)"/>
  <text x="90" y="116" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">FULL SCAN</text>
  <text x="90" y="134" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="8">7 loaders run</text>

  <!-- Arrow -->
  <line x1="150" y1="122" x2="185" y2="122" stroke="#34D399" stroke-width="1.5" marker-end="url(#df_arrow)"/>

  <!-- Hash + Store -->
  <rect x="190" y="95" width="130" height="55" rx="6" fill="#083344" stroke="#0891B2" stroke-width="1.5" filter="url(#df_shadow)"/>
  <text x="255" y="116" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="10" font-weight="bold">HASH OUTPUT</text>
  <text x="255" y="134" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="8">sha256 → cache</text>

  <!-- Arrow -->
  <line x1="320" y1="122" x2="355" y2="122" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#df_arrowC)"/>

  <!-- Full inject -->
  <rect x="360" y="95" width="150" height="55" rx="6" fill="#1C1917" stroke="#D97706" stroke-width="1.5" filter="url(#df_shadow)"/>
  <text x="435" y="116" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="10" font-weight="bold">INJECT ALL</text>
  <text x="435" y="134" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="8">~740 tokens</text>

  <!-- Arrow to context -->
  <line x1="510" y1="122" x2="545" y2="122" stroke="#FCD34D" stroke-width="1.5" marker-end="url(#df_arrowA)"/>

  <!-- Context window -->
  <rect x="550" y="95" width="120" height="55" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="610" y="116" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="10">CONTEXT</text>
  <text x="610" y="134" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="8">740 tokens used</text>

  <!-- === ROW 2: SECOND CALL (Diff) === -->
  <text x="30" y="195" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="bold">SECOND CALL</text>

  <!-- Scan box -->
  <rect x="30" y="205" width="120" height="55" rx="6" fill="#052E16" stroke="#059669" stroke-width="1.5" filter="url(#df_shadow)"/>
  <text x="90" y="226" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">RE-SCAN</text>
  <text x="90" y="244" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="8">7 loaders run</text>

  <!-- Arrow -->
  <line x1="150" y1="232" x2="185" y2="232" stroke="#34D399" stroke-width="1.5" marker-end="url(#df_arrow)"/>

  <!-- Compare -->
  <rect x="190" y="205" width="130" height="55" rx="6" fill="#083344" stroke="#0891B2" stroke-width="1.5" filter="url(#df_shadow)"/>
  <text x="255" y="226" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="10" font-weight="bold">COMPARE</text>
  <text x="255" y="244" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="8">new hash vs cached</text>

  <!-- Branch: Changed (top) -->
  <line x1="320" y1="222" x2="360" y2="206" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="360" y="190" width="150" height="32" rx="4" fill="#1C1917" stroke="#D97706" stroke-width="1.5"/>
  <text x="435" y="210" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="9" font-weight="bold">CHANGED → inject</text>

  <!-- Branch: Unchanged (bottom) -->
  <line x1="320" y1="242" x2="360" y2="252" stroke="#475569" stroke-width="1.5"/>
  <rect x="360" y="236" width="150" height="32" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="435" y="256" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="9">UNCHANGED → skip</text>

  <!-- Arrow to result -->
  <line x1="510" y1="206" x2="545" y2="222" stroke="#FCD34D" stroke-width="1.5" marker-end="url(#df_arrowA)"/>

  <!-- Context window (smaller) -->
  <rect x="550" y="205" width="120" height="55" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="610" y="226" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="10">CONTEXT</text>
  <text x="610" y="244" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="8" font-weight="bold">~80 tokens used</text>

  <!-- === SAVINGS COMPARISON === -->
  <rect x="100" y="295" width="500" height="80" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>

  <!-- Before bar -->
  <text x="120" y="320" fill="#94A3B8" font-family="monospace" font-size="9">Without diff:</text>
  <rect x="240" y="308" width="340" height="18" rx="3" fill="#D97706" opacity="0.3"/>
  <rect x="240" y="308" width="340" height="18" rx="3" fill="url(#df_amber)" opacity="0.5"/>
  <text x="410" y="321" text-anchor="middle" fill="#FEF3C7" font-family="monospace" font-size="9" font-weight="bold">740 tokens every call</text>

  <!-- After bar -->
  <text x="120" y="352" fill="#94A3B8" font-family="monospace" font-size="9">With diff:</text>
  <rect x="240" y="340" width="340" height="18" rx="3" fill="#1E293B"/>
  <rect x="240" y="340" width="37" height="18" rx="3" fill="url(#df_emerald)" opacity="0.7"/>
  <text x="290" y="353" fill="#ECFDF5" font-family="monospace" font-size="9" font-weight="bold">~80 tokens</text>
  <text x="490" y="353" fill="#10B981" font-family="monospace" font-size="9" font-weight="bold">89% saved</text>
</svg>
