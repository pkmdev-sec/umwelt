<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- Teal gradient (main) -->
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <!-- Teal gradient (vertical) -->
    <linearGradient id="tealGradV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <!-- Amber accent for pupil -->
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <!-- Logo glow -->
    <radialGradient id="logoGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <!-- Circle container gradient -->
    <radialGradient id="circleGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="80%" stop-color="#0a0a0a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Eye glow filter -->
    <filter id="eyeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Outer glow -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Title glow -->
    <filter id="titleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- Border frame -->
  <rect x="8" y="8" width="1484" height="484" rx="12" ry="12" fill="none" stroke="#21262d" stroke-width="1"/>
  <rect x="12" y="12" width="1476" height="476" rx="10" ry="10" fill="none" stroke="#1a1a2e" stroke-width="0.5" opacity="0.5"/>

  <!-- === LEFT SIDE: Enhanced Eye/Lens Logo === -->

  <!-- Background glow -->
  <circle cx="300" cy="250" r="220" fill="url(#logoGlow)" filter="url(#outerGlow)" opacity="0.5"/>

  <!-- Circular container - TWO rings -->
  <circle cx="300" cy="250" r="185" fill="url(#circleGrad)"/>
  <!-- Outer ring (subtle) -->
  <circle cx="300" cy="250" r="185" fill="none" stroke="#00d4aa" stroke-width="1" opacity="0.15"/>
  <!-- Inner ring (bright) -->
  <circle cx="300" cy="250" r="175" fill="none" stroke="#00d4aa" stroke-width="1.8" opacity="0.35"/>

  <!-- === Subtle scan lines radiating from eye (like radar) === -->
  <line x1="300" y1="250" x2="300" y2="80" stroke="#00d4aa" stroke-width="0.5" opacity="0.08"/>
  <line x1="300" y1="250" x2="420" y2="110" stroke="#00d4aa" stroke-width="0.5" opacity="0.06"/>
  <line x1="300" y1="250" x2="480" y2="200" stroke="#00d4aa" stroke-width="0.5" opacity="0.06"/>
  <line x1="300" y1="250" x2="480" y2="300" stroke="#00d4aa" stroke-width="0.5" opacity="0.06"/>
  <line x1="300" y1="250" x2="420" y2="390" stroke="#00d4aa" stroke-width="0.5" opacity="0.06"/>
  <line x1="300" y1="250" x2="300" y2="420" stroke="#00d4aa" stroke-width="0.5" opacity="0.08"/>
  <line x1="300" y1="250" x2="180" y2="390" stroke="#00d4aa" stroke-width="0.5" opacity="0.06"/>
  <line x1="300" y1="250" x2="120" y2="300" stroke="#00d4aa" stroke-width="0.5" opacity="0.06"/>
  <line x1="300" y1="250" x2="120" y2="200" stroke="#00d4aa" stroke-width="0.5" opacity="0.06"/>
  <line x1="300" y1="250" x2="180" y2="110" stroke="#00d4aa" stroke-width="0.5" opacity="0.06"/>

  <!-- === Perception Ring 3: Outer arc (dotted teal) — OS/APIs (system) === -->
  <path d="M 160 250 A 140 100 0 0 1 440 250" fill="none" stroke="#00d4aa" stroke-width="1.2" opacity="0.25" stroke-dasharray="3,6"/>
  <path d="M 160 250 A 140 100 0 0 0 440 250" fill="none" stroke="#00d4aa" stroke-width="1.2" opacity="0.25" stroke-dasharray="3,6"/>
  <!-- Orbiting data dots on outer ring -->
  <circle cx="180" cy="185" r="2.5" fill="#00d4aa" opacity="0.5"/>
  <circle cx="420" cy="185" r="2.5" fill="#00d4aa" opacity="0.5"/>
  <circle cx="180" cy="315" r="2.5" fill="#0d9488" opacity="0.5"/>
  <circle cx="420" cy="315" r="2.5" fill="#0d9488" opacity="0.5"/>

  <!-- === Perception Ring 2: Middle arc (dashed teal) — docker/tests (project) === -->
  <path d="M 190 250 A 110 78 0 0 1 410 250" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.4" stroke-dasharray="8,4"/>
  <path d="M 190 250 A 110 78 0 0 0 410 250" fill="none" stroke="#00d4aa" stroke-width="1.5" opacity="0.4" stroke-dasharray="8,4"/>
  <!-- Orbiting data dots on middle ring -->
  <circle cx="210" cy="198" r="2.5" fill="#00d4aa" opacity="0.6"/>
  <circle cx="390" cy="198" r="2.5" fill="#00d4aa" opacity="0.6"/>
  <circle cx="350" cy="310" r="2.5" fill="#0d9488" opacity="0.6"/>

  <!-- === Perception Ring 1: Inner arc (solid teal) — git/cwd (immediate) === -->
  <path d="M 225 250 A 75 55 0 0 1 375 250" fill="none" stroke="#00d4aa" stroke-width="2" opacity="0.7"/>
  <path d="M 225 250 A 75 55 0 0 0 375 250" fill="none" stroke="#00d4aa" stroke-width="2" opacity="0.7"/>
  <!-- Orbiting data dots on inner ring -->
  <circle cx="240" cy="215" r="2.5" fill="#00d4aa" opacity="0.8"/>
  <circle cx="360" cy="215" r="2.5" fill="#00d4aa" opacity="0.8"/>
  <circle cx="300" cy="305" r="2.5" fill="#00d4aa" opacity="0.8"/>

  <g filter="url(#eyeGlow)">
    <!-- === Central eye/lens === -->
    <!-- Eyelid line above -->
    <path d="M 210 245 Q 255 190 300 185 Q 345 190 390 245" fill="none" stroke="#00d4aa" stroke-width="1.2" opacity="0.4"/>
    <!-- Eyelid line below -->
    <path d="M 210 255 Q 255 310 300 315 Q 345 310 390 255" fill="none" stroke="#00d4aa" stroke-width="1.2" opacity="0.4"/>

    <!-- Outer almond/eye shape with teal gradient fill -->
    <path d="M 215 250 Q 257 195 300 190 Q 343 195 385 250 Q 343 305 300 310 Q 257 305 215 250 Z"
          fill="url(#tealGrad)" fill-opacity="0.85" stroke="#00d4aa" stroke-width="1.5" opacity="0.9"/>

    <!-- === Inner iris: concentric circles === -->
    <!-- Outer iris ring -->
    <circle cx="300" cy="250" r="32" fill="#0a1a18" stroke="#00d4aa" stroke-width="1.5" opacity="0.8"/>
    <!-- Bright iris ring -->
    <circle cx="300" cy="250" r="24" fill="none" stroke="#00d4aa" stroke-width="2.5" opacity="0.9"/>
    <!-- Inner iris detail -->
    <circle cx="300" cy="250" r="18" fill="#0d1117" stroke="#0d9488" stroke-width="1" opacity="0.7"/>

    <!-- === Pupil with amber accent === -->
    <circle cx="300" cy="250" r="10" fill="#0d1117"/>
    <circle cx="300" cy="250" r="8" fill="url(#amberGlow)" opacity="0.8"/>
    <circle cx="300" cy="250" r="5" fill="#f59e0b" opacity="0.6"/>
    <circle cx="300" cy="250" r="2" fill="#0d1117"/>

    <!-- White highlight (glow) -->
    <circle cx="290" cy="241" r="5" fill="#ffffff" opacity="0.5"/>
    <circle cx="308" cy="244" r="2.5" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- === RIGHT SIDE: Text === -->

  <!-- Title -->
  <text x="620" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" fill="#00d4aa" filter="url(#titleGlow)">UMWELT</text>

  <!-- Subtitle -->
  <text x="625" y="280" font-family="'SF Mono', 'Fira Code', monospace" font-size="28" fill="#8b949e" letter-spacing="8">ENVIRONMENT INTELLIGENCE</text>

  <!-- Tagline -->
  <text x="625" y="320" font-family="'SF Mono', 'Fira Code', monospace" font-size="18" fill="#6e7681">diff-based injection / predictive loading / cache-optimized context</text>

  <!-- Decorative line -->
  <line x1="620" y1="340" x2="1100" y2="340" stroke="#21262d" stroke-width="0.5"/>

  <!-- Version badge -->
  <rect x="625" y="355" width="62" height="28" rx="14" fill="transparent" stroke="#00d4aa" stroke-width="1.2" opacity="0.6"/>
  <text x="656" y="374" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#00d4aa" text-anchor="middle" opacity="0.8">v1.0</text>
</svg>
