<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="img">
  <title>Umwelt Profile Selection — Decision Tree</title>

  <defs>
    <linearGradient id="ps_emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ps_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="ps_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/><stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="ps_violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="ps_rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/><stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="ps_shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#020617" rx="10"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="16" font-weight="bold">Profile Selection — Decision Tree</text>
  <text x="400" y="50" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="10" opacity="0.5">Model tier → Token budget → Task type → Selected profile</text>

  <!-- === LEVEL 1: MODEL DETECTION === -->
  <rect x="310" y="65" width="180" height="40" rx="8" fill="#052E16" stroke="#10B981" stroke-width="2" filter="url(#ps_shadow)"/>
  <text x="400" y="89" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold">MODEL DETECTED?</text>

  <!-- Branches from model -->
  <line x1="340" y1="105" x2="130" y2="145" stroke="#34D399" stroke-width="1.5"/>
  <line x1="400" y1="105" x2="400" y2="145" stroke="#22D3EE" stroke-width="1.5"/>
  <line x1="460" y1="105" x2="670" y2="145" stroke="#FB7185" stroke-width="1.5"/>

  <!-- Opus -->
  <rect x="55" y="145" width="150" height="36" rx="6" fill="#052E16" stroke="#059669" stroke-width="1.5" filter="url(#ps_shadow)"/>
  <text x="130" y="167" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">OPUS</text>

  <!-- Sonnet -->
  <rect x="325" y="145" width="150" height="36" rx="6" fill="#083344" stroke="#0891B2" stroke-width="1.5" filter="url(#ps_shadow)"/>
  <text x="400" y="167" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="bold">SONNET</text>

  <!-- Haiku -->
  <rect x="595" y="145" width="150" height="36" rx="6" fill="#4C0519" stroke="#E11D48" stroke-width="1.5" filter="url(#ps_shadow)"/>
  <text x="670" y="167" text-anchor="middle" fill="#FB7185" font-family="monospace" font-size="11" font-weight="bold">HAIKU</text>

  <!-- === LEVEL 2: TOKEN BUDGET CHECK === -->
  <!-- Opus branch -->
  <line x1="130" y1="181" x2="130" y2="215" stroke="#059669" stroke-width="1"/>
  <rect x="45" y="215" width="170" height="36" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="130" y="237" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">Token budget &gt; 50%?</text>

  <!-- Opus YES -->
  <line x1="85" y1="251" x2="55" y2="285" stroke="#059669" stroke-width="1"/>
  <text x="50" y="278" fill="#10B981" font-family="monospace" font-size="8">YES</text>

  <!-- Opus NO -->
  <line x1="175" y1="251" x2="205" y2="285" stroke="#D97706" stroke-width="1"/>
  <text x="208" y="278" fill="#D97706" font-family="monospace" font-size="8">NO</text>

  <!-- Sonnet branch -->
  <line x1="400" y1="181" x2="400" y2="215" stroke="#0891B2" stroke-width="1"/>
  <rect x="315" y="215" width="170" height="36" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="400" y="237" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">Token budget &gt; 75%?</text>

  <!-- Sonnet YES -->
  <line x1="355" y1="251" x2="325" y2="285" stroke="#0891B2" stroke-width="1"/>
  <text x="320" y="278" fill="#06B6D4" font-family="monospace" font-size="8">YES</text>

  <!-- Sonnet NO -->
  <line x1="445" y1="251" x2="475" y2="285" stroke="#D97706" stroke-width="1"/>
  <text x="478" y="278" fill="#D97706" font-family="monospace" font-size="8">NO</text>

  <!-- Haiku → straight to minimal -->
  <line x1="670" y1="181" x2="670" y2="285" stroke="#E11D48" stroke-width="1"/>
  <text x="685" y="240" fill="#FB7185" font-family="monospace" font-size="8">always</text>

  <!-- === LEVEL 3: TASK TYPE === -->
  <!-- Opus YES → task type -->
  <rect x="10" y="285" width="100" height="36" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="60" y="307" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">Task type?</text>

  <!-- Opus YES branches -->
  <line x1="30" y1="321" x2="30" y2="360" stroke="#059669" stroke-width="1"/>
  <line x1="90" y1="321" x2="90" y2="360" stroke="#059669" stroke-width="1"/>

  <!-- Opus NO → downgrade -->
  <rect x="155" y="285" width="100" height="36" rx="6" fill="#1C1917" stroke="#D97706" stroke-width="1"/>
  <text x="205" y="301" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="9">DOWNGRADE</text>
  <text x="205" y="315" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="8">→ dev</text>

  <!-- Sonnet YES → task type -->
  <rect x="280" y="285" width="100" height="36" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="330" y="307" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">Task type?</text>

  <!-- Sonnet YES branches -->
  <line x1="300" y1="321" x2="300" y2="360" stroke="#0891B2" stroke-width="1"/>
  <line x1="360" y1="321" x2="360" y2="360" stroke="#0891B2" stroke-width="1"/>

  <!-- Sonnet NO → downgrade -->
  <rect x="425" y="285" width="100" height="36" rx="6" fill="#1C1917" stroke="#D97706" stroke-width="1"/>
  <text x="475" y="301" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="9">DOWNGRADE</text>
  <text x="475" y="315" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="8">→ minimal</text>

  <!-- === LEVEL 4: FINAL PROFILES === -->

  <!-- Opus → debug -->
  <rect x="5" y="365" width="90" height="50" rx="6" fill="#052E16" stroke="#059669" stroke-width="2" filter="url(#ps_shadow)"/>
  <text x="50" y="386" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">debug</text>
  <text x="50" y="402" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="7">full context</text>

  <!-- Opus → dev -->
  <rect x="105" y="365" width="90" height="50" rx="6" fill="#052E16" stroke="#059669" stroke-width="1.5" filter="url(#ps_shadow)"/>
  <text x="150" y="386" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">dev</text>
  <text x="150" y="402" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="7">balanced</text>

  <!-- Labels -->
  <text x="50" y="358" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="7">debug task</text>
  <text x="150" y="358" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="7">dev task</text>

  <!-- Opus downgraded to dev -->
  <line x1="205" y1="321" x2="205" y2="360" stroke="#D97706" stroke-width="1"/>
  <rect x="160" y="365" width="90" height="50" rx="6" fill="#1C1917" stroke="#D97706" stroke-width="1.5" opacity="0.5"/>

  <!-- Sonnet → dev -->
  <rect x="265" y="365" width="90" height="50" rx="6" fill="#083344" stroke="#0891B2" stroke-width="2" filter="url(#ps_shadow)"/>
  <text x="310" y="386" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="bold">dev</text>
  <text x="310" y="402" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="7">balanced</text>

  <!-- Sonnet → review -->
  <rect x="365" y="365" width="90" height="50" rx="6" fill="#083344" stroke="#0891B2" stroke-width="1.5" filter="url(#ps_shadow)"/>
  <text x="410" y="386" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="bold">review</text>
  <text x="410" y="402" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="7">diff focused</text>

  <text x="310" y="358" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="7">dev task</text>
  <text x="410" y="358" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="7">review task</text>

  <!-- Sonnet downgraded to minimal -->
  <line x1="475" y1="321" x2="475" y2="360" stroke="#D97706" stroke-width="1"/>
  <rect x="430" y="365" width="90" height="50" rx="6" fill="#1C1917" stroke="#D97706" stroke-width="1.5" opacity="0.5"/>
  <text x="475" y="386" text-anchor="middle" fill="#FCD34D" font-family="monospace" font-size="11" font-weight="bold">minimal</text>
  <text x="475" y="402" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="7">&lt;200 tokens</text>

  <!-- Haiku → minimal -->
  <rect x="625" y="365" width="90" height="50" rx="6" fill="#4C0519" stroke="#E11D48" stroke-width="2" filter="url(#ps_shadow)"/>
  <text x="670" y="386" text-anchor="middle" fill="#FB7185" font-family="monospace" font-size="11" font-weight="bold">minimal</text>
  <text x="670" y="402" text-anchor="middle" fill="#FDA4AF" font-family="monospace" font-size="7">&lt;200 tokens</text>

  <!-- Legend -->
  <rect x="30" y="440" width="740" height="40" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <circle cx="60" cy="460" r="5" fill="#059669"/>
  <text x="72" y="464" fill="#6EE7B7" font-family="monospace" font-size="9">Opus path</text>
  <circle cx="180" cy="460" r="5" fill="#0891B2"/>
  <text x="192" y="464" fill="#67E8F9" font-family="monospace" font-size="9">Sonnet path</text>
  <circle cx="310" cy="460" r="5" fill="#E11D48"/>
  <text x="322" y="464" fill="#FDA4AF" font-family="monospace" font-size="9">Haiku path</text>
  <circle cx="440" cy="460" r="5" fill="#D97706"/>
  <text x="452" y="464" fill="#FBBF24" font-family="monospace" font-size="9">Budget exceeded → downgrade</text>
</svg>
